<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pod Store</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/guahhinc/launcher/main/Pod_Store_Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0c0e14;
      --card-bg: #141722;
      --card-hover: #1c2030;
      --sidebar-bg: #090b10;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --green-hover: #059669;
      --blue-update: #2563eb;
      --blue-update-hover: #1d4ed8;
      --text: #f3f4f6;
      --text-muted: #8b92a5;
      --border: #23283a;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Sidebar */
    aside {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding: 0 6px;
      cursor: pointer;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      object-fit: contain;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 14px 0 6px 6px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      width: 100%;
    }

    .nav-btn:hover {
      background: var(--card-bg);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--card-bg);
      color: #fff;
      border-color: var(--border);
    }

    .badge-update {
      margin-left: auto;
      background: var(--blue-update);
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sidebar-games-scroll {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      flex: 1;
      margin-top: 2px;
    }

    .empty-sidebar-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 8px 10px;
      font-style: italic;
    }

    /* Main Container */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header-bar h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Store Banner */
    .featured-banner {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 32px;
      height: 300px;
      display: flex;
      align-items: flex-end;
      padding: 32px;
      background-size: cover;
      background-position: center;
      border: 1px solid var(--border);
    }

    .featured-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 14, 20, 0.1) 0%, rgba(12, 14, 20, 0.92) 100%);
    }

    .featured-content {
      position: relative;
      z-index: 1;
      max-width: 600px;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .featured-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .featured-desc {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 5px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border: none;
      transition: background 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-download {
      background: var(--green);
      color: #fff;
    }
    .btn-download:hover {
      background: var(--green-hover);
    }

    .btn-update {
      background: var(--blue-update);
      color: #fff;
    }
    .btn-update:hover {
      background: var(--blue-update-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-icon {
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Dropdown Menu (More Options) */
    .dropdown-container {
      position: relative;
      display: inline-block;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-width: 190px;
      padding: 4px;
      display: none;
      flex-direction: column;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .dropdown-menu.show {
      display: flex;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      border-radius: 4px;
      transition: background 0.1s ease;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .dropdown-item.danger {
      color: #ef4444;
    }
    .dropdown-item.danger:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    /* Game Detail Fullpage Layout */
    .game-page-container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Thumbnail Hero Banner with title & buttons integrated inside */
    .game-page-hero-banner {
      position: relative;
      width: 100%;
      height: 340px;
      border-radius: var(--radius);
      background-size: cover;
      background-position: center;
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      padding: 28px 32px;
      margin-bottom: 28px;
    }

    .game-page-hero-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 14, 20, 0.05) 0%, rgba(12, 14, 20, 0.92) 100%);
      border-radius: var(--radius);
    }

    .game-page-hero-content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .game-page-hero-title h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .game-details-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 32px;
      align-items: start;
    }

    .game-main-info {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-heading {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text);
    }

    .game-description-text {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .game-meta-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .meta-label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .meta-value {
      color: var(--text);
      font-weight: 700;
    }

    /* Store & Library Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .game-card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background-color: #1a1e2d;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 14px;
      flex: 1;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 50px;
      height: 50px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #191e2b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 600;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2000;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside>
    <div class="brand" onclick="switchView('store')">
      <img src="https://raw.githubusercontent.com/guahhinc/launcher/main/Pod_Store_Icon.png" alt="Pod Store Logo" />
      <h1>Pod Store</h1>
    </div>

    <div class="nav-label">Menu</div>
    <nav>
      <button class="nav-btn active" id="nav-store" onclick="switchView('store')">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Store
      </button>
      <button class="nav-btn" id="nav-library" onclick="switchView('library')">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        My Library
        <!-- Only shown when updates are available -->
        <span class="badge-update" id="library-update-badge" style="display: none;">UPDATE</span>
      </button>
    </nav>

    <!-- My Games List in Sidebar -->
    <div class="nav-label">My Games</div>
    <div class="sidebar-games-scroll" id="sidebar-games-list">
      <!-- Injected via JS -->
    </div>
  </aside>

  <!-- Main Content Area -->
  <main id="main-content">
    <!-- Rendered dynamically by JavaScript -->
  </main>

  <!-- Toast Notification -->
  <div id="toast">Message here</div>

  <script>
    // Game Catalog
    const games = [
      {
        id: "duck-td",
        title: "Duck TD",
        version: "1.0.1",
        tag: "Tower Defense",
        developer: "Guahh Inc.",
        desc: "Defend against waves of enemies with tactical feathered firepower in this action-packed tower defense game. Build, upgrade, and strategically place towers across multiple maps to survive the onslaught.",
        bg: "https://raw.githubusercontent.com/guahhinc/launcher/main/Backgrounds/duck_td_background.png",
        gameUrl: "https://raw.githubusercontent.com/guahhinc/launcher/main/Games/Duck_TD.html",
        downloadFilename: "Duck_TD.html"
      }
    ];

    // Local Storage State
    let library = JSON.parse(localStorage.getItem('pod_library') || '[]');
    let installedVersions = JSON.parse(localStorage.getItem('pod_installed_versions') || '{}');
    let currentView = 'store'; // 'store', 'library', or 'game:<id>'

    function saveState() {
      localStorage.setItem('pod_library', JSON.stringify(library));
      localStorage.setItem('pod_installed_versions', JSON.stringify(installedVersions));
      updateUpdateBadges();
      renderSidebarGames();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function isInLibrary(id) {
      return library.includes(id);
    }

    function getUpdateStatus(gameId) {
      const game = games.find(g => g.id === gameId);
      if (!game) return { hasUpdate: false, isDownloaded: false, installedVer: null };
      
      const installedVer = installedVersions[gameId] || null;
      const isDownloaded = Boolean(installedVer);
      const hasUpdate = isDownloaded && installedVer !== game.version;
      return { hasUpdate, isDownloaded, installedVer };
    }

    function updateUpdateBadges() {
      const updateCount = library.filter(id => getUpdateStatus(id).hasUpdate).length;
      const badge = document.getElementById('library-update-badge');
      if (badge) {
        if (updateCount > 0) {
          badge.style.display = 'inline-block';
          badge.textContent = updateCount > 1 ? `${updateCount} UPDATES` : 'UPDATE';
        } else {
          badge.style.display = 'none';
        }
      }
    }

    function addToLibrary(id) {
      if (!library.includes(id)) {
        library.push(id);
        saveState();
        showToast('Added to your Library!');
        render();
      }
    }

    function removeFromLibrary(id) {
      library = library.filter(item => item !== id);
      delete installedVersions[id];
      saveState();
      showToast('Removed from Library');
      switchView('library');
    }

    // Direct Download and Version Tracker
    function downloadGame(gameId) {
      const game = games.find(g => g.id === gameId);
      if (!game) return;

      showToast(`Downloading ${game.title}...`);

      fetch(game.gameUrl)
        .then(res => res.text())
        .then(html => {
          const blob = new Blob([html], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = game.downloadFilename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          // Update installed version record
          installedVersions[gameId] = game.version;
          saveState();
          showToast(`Downloaded ${game.title}!`);
          render();
        })
        .catch(() => {
          window.open(game.gameUrl, '_blank');
          installedVersions[gameId] = game.version;
          saveState();
          render();
        });
    }

    function openGamePage(id) {
      currentView = `game:${id}`;
      render();
    }

    function switchView(view) {
      currentView = view;
      render();
    }

    function toggleDropdown(event) {
      event.stopPropagation();
      const menu = document.getElementById('options-dropdown');
      if (menu) menu.classList.toggle('show');
    }

    // Close dropdown on outside click
    window.addEventListener('click', () => {
      const menu = document.getElementById('options-dropdown');
      if (menu) menu.classList.remove('show');
    });

    function renderSidebarGames() {
      const list = document.getElementById('sidebar-games-list');
      if (library.length === 0) {
        list.innerHTML = `<div class="empty-sidebar-note">No games yet</div>`;
        return;
      }

      list.innerHTML = library.map(id => {
        const game = games.find(g => g.id === id);
        if (!game) return '';
        const { hasUpdate } = getUpdateStatus(id);
        const isActive = currentView === `game:${id}`;

        return `
          <button class="nav-btn ${isActive ? 'active' : ''}" onclick="openGamePage('${game.id}')">
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${game.title}</span>
            ${hasUpdate ? `<span class="badge-update">UPDATE</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function render() {
      const main = document.getElementById('main-content');

      // Update sidebar active highlights
      document.getElementById('nav-store').classList.toggle('active', currentView === 'store');
      document.getElementById('nav-library').classList.toggle('active', currentView === 'library');
      updateUpdateBadges();
      renderSidebarGames();

      if (currentView === 'store') {
        const featured = games[0];
        const isOwned = isInLibrary(featured.id);
        const { hasUpdate } = getUpdateStatus(featured.id);

        main.innerHTML = `
          <div class="header-bar">
            <h2>Store Catalog</h2>
          </div>

          <!-- Featured Game Banner -->
          <div class="featured-banner" style="background-image: url('${featured.bg}');">
            <div class="featured-content">
              <span class="tag">${featured.tag}</span>
              <h2 class="featured-title">${featured.title}</h2>
              <p class="featured-desc">${featured.desc}</p>
              <div class="btn-group">
                ${isOwned 
                  ? `
                    ${hasUpdate 
                      ? `<button class="btn btn-update" onclick="downloadGame('${featured.id}')">⬆ Update</button>`
                      : `<button class="btn btn-download" onclick="downloadGame('${featured.id}')">⬇ Download</button>`
                    }
                    <button class="btn btn-secondary" onclick="openGamePage('${featured.id}')">View Details</button>
                  `
                  : `<button class="btn btn-primary" onclick="addToLibrary('${featured.id}')">+ Add to Library</button>
                     <button class="btn btn-secondary" onclick="openGamePage('${featured.id}')">View Details</button>`
                }
              </div>
            </div>
          </div>

          <!-- Store Grid -->
          <h3 style="font-size: 1.15rem; margin-bottom: 16px; font-weight: 700;">All Games</h3>
          <div class="games-grid">
            ${games.map(game => {
              const owned = isInLibrary(game.id);
              const { hasUpdate } = getUpdateStatus(game.id);

              return `
                <div class="game-card" onclick="openGamePage('${game.id}')">
                  <img class="card-thumb" src="${game.bg}" alt="${game.title}" />
                  <div class="card-body">
                    <span class="tag" style="width: fit-content;">${game.tag}</span>
                    <h4 class="card-title">
                      <span>${game.title}</span>
                      ${hasUpdate ? `<span class="badge-update">UPDATE</span>` : ''}
                    </h4>
                    <p class="card-desc">${game.desc}</p>
                    <div class="btn-group" onclick="event.stopPropagation()">
                      ${owned 
                        ? `<button class="btn btn-secondary" style="flex:1;" onclick="openGamePage('${game.id}')">In Library ✓</button>`
                        : `<button class="btn btn-primary" style="flex:1;" onclick="addToLibrary('${game.id}')">+ Add to Library</button>`
                      }
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (currentView === 'library') {
        const ownedGames = games.filter(g => isInLibrary(g.id));

        if (ownedGames.length === 0) {
          main.innerHTML = `
            <div class="header-bar">
              <h2>My Library</h2>
            </div>
            <div class="empty-state">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              <h3 style="margin-bottom: 8px;">Your library is empty</h3>
              <p style="margin-bottom: 16px;">Add games from the store to start downloading them.</p>
              <button class="btn btn-primary" onclick="switchView('store')">Browse Store</button>
            </div>
          `;
          return;
        }

        main.innerHTML = `
          <div class="header-bar">
            <h2>My Library</h2>
          </div>
          <div class="games-grid">
            ${ownedGames.map(game => {
              const { hasUpdate } = getUpdateStatus(game.id);

              return `
                <div class="game-card" onclick="openGamePage('${game.id}')">
                  <img class="card-thumb" src="${game.bg}" alt="${game.title}" />
                  <div class="card-body">
                    <span class="tag" style="width: fit-content;">${game.tag}</span>
                    <h4 class="card-title">
                      <span>${game.title}</span>
                      ${hasUpdate ? `<span class="badge-update">UPDATE</span>` : ''}
                    </h4>
                    <p class="card-desc">${game.desc}</p>
                    <div class="btn-group" onclick="event.stopPropagation()">
                      ${hasUpdate
                        ? `<button class="btn btn-update" style="flex:1;" onclick="downloadGame('${game.id}')">⬆ Update</button>`
                        : `<button class="btn btn-download" style="flex:1;" onclick="downloadGame('${game.id}')">⬇ Download</button>`
                      }
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (currentView.startsWith('game:')) {
        // Full Game Page with title, download/update & more options inside the hero area
        const gameId = currentView.replace('game:', '');
        const game = games.find(g => g.id === gameId);
        if (!game) return switchView('store');

        const isOwned = isInLibrary(game.id);
        const status = getUpdateStatus(game.id);

        main.innerHTML = `
          <div class="game-page-container">
            <!-- Hero Thumbnail Background with Title & Buttons inside -->
            <div class="game-page-hero-banner" style="background-image: url('${game.bg}');">
              <div class="game-page-hero-content">
                <div class="game-page-hero-title">
                  <h1>${game.title}</h1>
                </div>

                <div class="btn-group">
                  ${isOwned ? `
                    ${status.hasUpdate 
                      ? `<button class="btn btn-update" onclick="downloadGame('${game.id}')">⬆ Update</button>`
                      : `<button class="btn btn-download" onclick="downloadGame('${game.id}')">⬇ Download</button>`
                    }

                    <!-- More Options Dropdown -->
                    <div class="dropdown-container">
                      <button class="btn btn-icon" onclick="toggleDropdown(event)" title="More Options">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="12" r="2"/></svg>
                      </button>
                      <div class="dropdown-menu" id="options-dropdown">
                        <button class="dropdown-item danger" onclick="removeFromLibrary('${game.id}')">
                          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                          Remove from Library
                        </button>
                      </div>
                    </div>
                  ` : `
                    <button class="btn btn-primary" onclick="addToLibrary('${game.id}')">+ Add to Library</button>
                  `}
                </div>
              </div>
            </div>

            <!-- Details Layout: Description & Meta Panel under the thumbnail -->
            <div class="game-details-layout">
              <div class="game-main-info">
                <h3 class="section-heading">About</h3>
                <p class="game-description-text">${game.desc}</p>
              </div>

              <div class="game-meta-panel">
                <h3 class="section-heading">Details</h3>

                <div class="meta-row">
                  <span class="meta-label">Genre</span>
                  <span class="meta-value">${game.tag}</span>
                </div>

                <div class="meta-row">
                  <span class="meta-label">Version</span>
                  <span class="meta-value">v${game.version}</span>
                </div>

                ${isOwned && status.installedVer ? `
                  <div class="meta-row">
                    <span class="meta-label">Installed</span>
                    <span class="meta-value">v${status.installedVer}</span>
                  </div>
                ` : ''}

                <div class="meta-row">
                  <span class="meta-label">Developer</span>
                  <span class="meta-value">${game.developer}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    // Initialize
    saveState();
    render();
  </script>
</body>
</html>
